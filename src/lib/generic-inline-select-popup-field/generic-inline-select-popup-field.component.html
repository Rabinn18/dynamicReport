<div class="filterBox divSelection" [ngClass]="this.field.selected == true ? 'my-auto' : ''">
    <span style="cursor: pointer" (click)="toggleDivSelectionPopup()">{{this.fieldName}}</span>
    <div>
        <div class="selected-wrapper ml-3" (mouseover)="this.togglePopup($event, selectedDatas, '#CFE8FF')">
            <span class="selectedCount"> 
              {{ selectedDatas.length === dataArray.length && selectedDatas.length > 0 ? 'All Selected' : '(' + selectedDatas.length + ') Selected' }}
            </span>
        </div>     
        <i class="bi" 
          [ngClass]="showDivSelectionPopup ? 'bi-chevron-up' : 'bi-chevron-down'" 
          style="cursor: pointer"
          (click)="toggleDivSelectionPopup()"
        ></i>
    </div>
</div>

<div class="divSelectionPopup" *ngIf="showDivSelectionPopup">
    <div class="search mx-0 px-0">
        <div class="input-group mb-3 mx-0 px-0">
            <span class="input-group-text" id="basic-addon1"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" placeholder="Search here" aria-label="Search here" aria-describedby="basic-addon1">
        </div>
    </div>
    <div class="divList">
        <ul>
            <!-- Changed to iterate over dataArray (which now has {name, value} objects) -->
            <li *ngFor="let option of dataArray">
              <input
                  type="checkbox"
                  [id]="option.value"
                  [value]="option.value"
                  [checked]="isChecked(option.value)"
                  (change)="toggleTempDataSelection(option, $event)"
                />
              <!-- Show name in UI -->
              <label [for]="option.value">{{ option.name }}</label>
            </li>
        </ul>
    </div>
    <div class="selectAll">
        <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="checkAll"
              [checked]="isAllChecked()"
              (change)="toggleAllTempDatas($event)"
            />
            <label class="form-check-label" for="checkAll" style="width: auto">
                Select/Deselect All
            </label>
            <div class="d-flex justify-content-between align-items-center">
              <button type="button" class="btn btn-secondary cancelButton" (click)="cancelDataSelection()">Cancel</button>
              <button type="button" class="btn btn-primary applyButton ml-1" (click)="applyDataSelection()">Apply</button>
            </div>
        </div>
    </div>
</div>

<div
  *ngIf="showPopup"
  class="custom-popup"
  [ngStyle]="popupStyle"
  [style.--popup-arrow-color]="popupArrowColor"
>
  <ul>
    <!-- This shows names in the hover popup -->
    <li *ngFor="let item of popupData">{{ item }}</li>
  </ul>
</div>
