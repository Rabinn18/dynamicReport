<style>
  span {
    text-decoration: none;
    display: inline-block;
    padding: 8px 8px;
  }

  span:hover {
    background-color: #ddd;
    color: black;
  }
  .round {
    border-radius: 50%;
  }
  select:focus-visible {
    outline: none !important;
  }
</style>

<div>
  <select
    (change)="pagesizeChange($event)"
    style="border: 1px solid #ddd; border-radius: 5px"
    [(ngModel)]="pageSize"
  >
    <option value="5">5 records per page</option>
    <option value="10">10 records per page</option>
    <option value="20">20 records per page</option>
    <option value="30">30 records per page</option>
    <option value="40">40 records per page</option>
    <option value="50">50 records per page</option>
  </select>

  <span>page {{currentPage}} of {{totalRecord}}</span>
  <a>
    <span class="glyphicon glyphicon-menu-left round" (click)="clickLessthan()">
    </span>
  </a>
  <a>
    <span
      class="glyphicon glyphicon-menu-right round"
      (click)="clickGreaterthan()"
    ></span>
  </a>
</div>
