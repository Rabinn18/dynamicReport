  #filterindex button {
    border: none;

<ng-container
  [ngTemplateOutlet]="newTemplate || filterTemplate"
  [ngTemplateOutletContext]="{UserReportList:UserReportList,selectedFields:selectedFields,
    requiredFields:requiredFields,optionalFields:optionalFields,applyFiltering:applyFilter,excelDownloading:excelDownload}"
></ng-container>

<ng-template
  #filterTemplate
  let-UserReportList="UserReportList"
  let-selectedFields="selectedFields"
  let-requiredFields="requiredFields"
  let-optionalFields="optionalFields"
  let-applyFiltering="applyFiltering"
  let-excelDownloading="excelDownloading"
>
  <div
    class="row"
    id="filterindex"
    style="
      height: 70vh;
      background: #ffffff;
      transition: 0.5s;
      border: 2px solid #ddd;
      border-radius: 10px;
      overflow-y: scroll;
      overflow-x: hidden;
    "
  >
    <div
      class="row"
      style="
        padding: 6%;
        display: flex;

        flex-direction: column;
        margin-bottom: 20px;
        justify-content: space-between;
      "
    >
      <div>
        <span
          style="
            padding-left: 15px;
            padding-bottom: 15px;
            display: block;
            padding-bottom: 6px;
          "
        >
          <strong style="border-bottom: 1px solid #ddd; font-size: 24px"
            >Custom Reports</strong
          >
        </span>
        <ul
          *ngFor="let item of UserReportList"
          style="
            list-style: none;
            padding-left: 5px;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 15px;
            background-color: #f0f3f4;
            border-left: 3px solid #393434;
            margin-left: 2px;
          "
        >
          <li style="display: flex; align-items: center; position: relative">
            {{item.reportName}}
            <!-- <span
            class="glyphicon glyphicon-minus icon-large"
            style="padding: 2px; font-size: larger"
            (click)="deleteReport(item)" (click)="deleteReport(item)"
          ></span> -->

            <div
              class="dotted-menu"
              (click)="deleteReport(item.reportName)"
              style="margin-left: auto; cursor: pointer; margin-top: -3px"
            >
              <span class="dot"></span>
              <!-- <span class="dot"></span>
            <span class="dot"></span> -->
              <!-- <span class="glyphicon glyphicon-filter icon-large"></span> -->
            </div>
            <ul class="reportPopup">
              <li>
                <a href="#" (click)="deleteReport(item.reportName)">Delete</a>
              </li>
              <!-- <li>Edit</li> -->
            </ul>
          </li>
        </ul>
      </div>

      <div style="padding-top: 0px; padding-bottom: 6px; padding-left: 15px">
        <button class="accordion" (click)="toggleAccordian($event)">
          <span
            class="glyphicon glyphicon glyphicon-triangle-bottom"
            style="top: -1px"
          ></span>
          &nbsp;Selected fields
        </button>
        <div class="panel-wrapper">
          <ng-container
            [ngTemplateOutlet]="fieldList"
            [ngTemplateOutletContext]="{fields:selectedFields}"
          >
          </ng-container>
        </div>
      </div>
      <div style="padding-top: 0px; padding-bottom: 6px; padding-left: 15px">
        <button class="accordion" (click)="toggleAccordian($event)">
          <span
            class="glyphicon glyphicon glyphicon-triangle-bottom"
            style="top: -1px"
          ></span>
          &nbsp;Required fields
        </button>
        <div class="panel-wrapper">
          <ng-container
            [ngTemplateOutlet]="fieldList"
            [ngTemplateOutletContext]="{fields:requiredFields}"
          >
          </ng-container>
        </div>
      </div>
      <div style="padding-top: 0px; padding-bottom: 6px; padding-left: 15px">
        <button class="accordion" (click)="toggleAccordian($event)">
          <span
            class="glyphicon glyphicon glyphicon-triangle-bottom"
            style="top: -1px"
          ></span>
          &nbsp;Optional fields
        </button>
        <ng-container
          [ngTemplateOutlet]="fieldList"
          [ngTemplateOutletContext]="{fields:optionalFields}"
        >
        </ng-container>
      </div>
      <div class="panel-wrapper">
        <ng-template #fieldList let-fields="fields">
          <div class="panel" *ngFor="let fld of fields">
            <div *ngIf="fld.isFieldDisabled==false">
              <label
                ><input
                  type="checkbox"
                  [(ngModel)]="fld.selected"
                  [disabled]="fld.required"
                  (change)="selectChangeHandler($event)"
                />{{fld.fieldName}}</label
              >

              <div *ngIf="fld.controlType=='text'">
                <div *ngIf="fld.selected" style="margin-left: 8%">
                  <select
                    class=""
                    [(ngModel)]="fld.operatorValue"
                    style="margin-bottom: 2%; width: 30%"
                  >
                    <option *ngFor="let opt of fld.operators">{{opt}}</option>
                  </select>

                  <input
                    type="text"
                    class=""
                    [(ngModel)]="fld.fieldValue"
                    aria-label="Small"
                    aria-describedby="inputGroup-sizing-sm"
                    style="margin-bottom: 10%; width: 90%"
                  />
                </div>
              </div>
              <div *ngIf="fld.controlType=='checkbox'">
                <div *ngIf="fld.selected" style="margin-left: 8%">
                  <generic-checkbox
                    id="checkbox"
                    [(ngModel)]="fld.fieldValue"
                    [label]="fld.fieldName"
                    [showLabel]="$any(1)"
                  >
                  </generic-checkbox>
                  <label for="checkbox">{{fld.fieldName}}</label>
                </div>
              </div>
              <div
                *ngIf="fld.controlType=='dropdownmultiselect' && fld.selected"
                style="margin-left: 8%"
              >
                <select
                  [(ngModel)]="fld.operatorValue"
                  style="margin-bottom: 2%; width: 30%"
                >
                  <option *ngFor="let opt of fld.operators">{{opt}}</option>
                </select>

                <dropdown-multiselect
                  #dropdown="ngModel"
                  [data]="fld.fieldSelectionValues.fieldvalues"
                  [(ngModel)]="fld.fieldValue"
                  (onItemSelect)="onItemSelect($event,fld)"
                  (onItemDeSelect)="onItemSelect($event,fld)"
                >
                </dropdown-multiselect>
                <!-- <p>{{dropdown.control | json}}</p> -->
              </div>
              <div
                *ngIf="fld.controlType=='dropdown' && fld.selected"
                style="margin-left: 8%"
              >
                <select
                  [(ngModel)]="fld.operatorValue"
                  style="margin-bottom: 2%; width: 30%"
                >
                  <option *ngFor="let opt of fld.operators">{{opt}}</option>
                </select>
                <select [(ngModel)]="fld.fieldvalue">
                  <option
                    *ngFor="let optfld of fld.fieldSelectionValues.fieldvalues "
                    [value]="optfld.value"
                  >
                    {{optfld.name}}
                  </option>
                </select>
              </div>
              <div *ngIf="fld.controlType=='daterange'&& fld.selected">
                <div style="margin-left: 8%">
                  <generic-daterange-picker
                    [(ngModel)]="fld.fieldValue"
                    [FiscalBeginDate]="ReportFilterSetting.fiscalBeginDate"
                  >
                  </generic-daterange-picker>
                </div>
              </div>
              <div
                *ngIf="fld.controlType=='date' && fld.selected"
                style="margin-top: 2%"
              >
                <input
                  type="date"
                  [(ngModel)]="fld.fieldValue"
                  class="form-control"
                  style="margin-top: 1%; width: 90%; margin-bottom: 3%"
                />
              </div>
              <div
                *ngIf="fld.controlType=='multiselect' && fld.selected"
                style="margin-top: 2%"
              >
                <generic-multiselect
                  [dataSource]="fld.fieldSelectionValues.fieldvalues"
                  fieldName="name"
                  fieldId="value"
                  (onSelect)="onMultiSelect($event,fld)"
                >
                </generic-multiselect>
              </div>
            </div>
          </div>
        </ng-template>
      </div>

      <div class="button-wrapper" style="padding-left: 15px">
        <button
          (click)="applyFiltering()"
          class="btn btn-info"
          style="margin-top: 2%; margin-left: 2px; margin-right: 2px"
        >
          Apply filter
        </button>
        <button
          (click)="excelDownload()"
          class="btn btn-info"
          style="margin-top: 2%"
        >
          Download
        </button>
        <!-- <button
        (click)="saveReport()"
        class="btn btn-info"
        style="margin-top: 2%"
      >
        Save
      </button> -->

        <!-- <button
          (click)="applyFilter()"
          class="btn btn-info"
          style="margin-top: 2%"
        >
          Reset filter
        </button> -->
      </div>
    </div>
  </div>
</ng-template>
