<h2 mat-dialog-title>{{title}}</h2>
<form [formGroup]="form">
  <mat-dialog-content>
    <mat-form-field MatFormFieldControl="description">
      <input
        matInput
        [placeholder]="Description"
        formControlName="description"
      />
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button class="btn btn-secondary" (click)="onClose()">Close</button>
    <button class="btn btn-primary" (click)="onSaveDialogClick()">Save</button>
  </mat-dialog-actions>
</form>
