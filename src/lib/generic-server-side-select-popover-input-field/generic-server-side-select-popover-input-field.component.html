<div class="filterBox selection" [ngClass]="this.field.isRequired == true ? 'my-auto' : ''">
  <span style="cursor: pointer" (click)="toggleSelectionPopup($event)">{{this.fieldName}}</span>
  <div>
    <div class="selected-wrapper ml-3">
      <span class="selectedCount" [title]="getDisplayValue()">
        {{ getDisplayValue() }}
      </span>
    </div>
    <i class="bi" 
      [ngClass]="showSelectionPopup ? 'bi-chevron-up' : 'bi-chevron-down'" 
      style="cursor: pointer"
      (click)="toggleSelectionPopup($event)"
    ></i>
  </div>
</div>

<div class="selectionPopup" *ngIf="showSelectionPopup" [ngStyle]="selectionPopupStyle">
  <!-- Search Section -->
  <div class="search mx-0 px-0 d-flex justify-content-between">
    <div class="select">
      <div class="dropdown">
        <button class="btn btn-secondary dropdown-toggle my-auto" type="button" 
          id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" 
          aria-expanded="false" 
          style="height: 25px !important; background-color: #fff; color: black; width: 120px; font-size: 11px;">
          <span class="my-0" style="color: rgba(207, 207, 207, 0.7);">
            {{ formatHeader(searchField) }}
          </span>
        </button>
        <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
          <a class="dropdown-item" 
             *ngFor="let col of searchableColumns" 
             (click)="onSearchFieldChange(col.field)"
             style="cursor: pointer;">
            {{ col.header }}
          </a>
        </div>
      </div>
    </div>
    <div class="input-group mb-1 ml-2 mr-0 px-0">
      <span class="input-group-text" id="basic-addon1"><i class="bi bi-search"></i></span>
      <input 
        type="text" 
        class="form-control" 
        placeholder="Enter Keyword" 
        aria-label="Search here" 
        aria-describedby="basic-addon1"
        [value]="searchTerm"
        (input)="onSearchChange($event)">
    </div>
  </div>

  <!-- Loading Indicator -->
  <div *ngIf="isLoading" class="loading-indicator">
    <div class="spinner-border spinner-border-sm" role="status">
      <span class="sr-only">Loading...</span>
    </div>
    <span class="ml-2">Loading data...</span>
  </div>

  <!-- List Section with Dynamic Columns -->
  <div class="divList" *ngIf="!isLoading">
    <!-- Column Headers -->
    <div class="list-header">
      <div class="header-checkbox" *ngIf="this.field.controlType === 'multiselect'">
        <div class="form-check">
          <input
            class="form-check-input"
            type="checkbox"
            id="checkAll"
            [checked]="this.field.fieldValue == '%'"
            (change)="toggleAllTempValues($event)"
          />
        </div>
      </div>
      <div class="header-column" *ngFor="let col of columns">
        {{ col.header }}
      </div>
    </div>
    
    <div class="list-container">
      <div class="list-item" 
           *ngFor="let item of filteredOptions; let i = index" 
           (click)="applyValueSelectionSingle(item)">
        <div class="checkbox-section ml-2" *ngIf="this.field.controlType === 'multiselect'">
          <input
            type="checkbox"
            [id]="'checkbox-' + i"
            [checked]="this.field.fieldValue == '%' || isChecked(item)"
            (change)="toggleTempValueSelection(item, $event)"
            (click)="$event.stopPropagation()"
          />
        </div>
        <div class="data-column" *ngFor="let col of columns">
          <span class="item-value">{{ item[col.field] || '-' }}</span>
        </div>
      </div>

      <!-- No Data Message -->
      <div *ngIf="filteredOptions.length === 0" class="no-data-message">
        <p>No data found</p>
      </div>
    </div>
  </div>

  <div class="footer-section d-flex justify-content-between align-items-center">
    <!-- Pagination Section -->
    <div class="pagination-section mb-0 pb-0" *ngIf="totalPages > 1">
      <div class="pagination-controls">
        <button 
          type="button" 
          class="btn btn-sm pagination-btn" 
          (click)="previousPage()" 
          [disabled]="currentPage === 1 || isLoading">
          Previous
        </button>
        
        <div class="page-numbers">
          <button 
            type="button" 
            class="btn btn-sm page-number" 
            *ngFor="let page of getPageNumbers()" 
            [disabled]="page === '...' || isLoading"
            (click)="onPageClick(page)"
            [class.active]="page === currentPage"
            [class.ellipsis]="page === '...'">
            {{ page }}
          </button>
        </div>
        
        <button 
          type="button" 
          class="btn btn-sm pagination-btn" 
          (click)="nextPage()" 
          [disabled]="currentPage === totalPages || isLoading">
          Next
        </button>
      </div>
      
      <!-- Page Info -->
      <!-- <div class="page-info">
        <small>Showing {{ (currentPage - 1) * itemsPerPage + 1 }} - 
          {{ Math.min(currentPage * itemsPerPage, totalCount) }} of {{ totalCount }}</small>
      </div> -->
    </div>

    <!-- Select All and Apply Section -->
    <div class="selectAll mb-0 pb-0">
      <div class="form-check-container">
        <div class="button-group">
          <button type="button" class="btn btn-secondary cancelButton" 
            (click)="cancelValueSelection()" [disabled]="isLoading">
            Cancel
          </button>
          <button type="button" class="btn btn-primary applyButton" 
            (click)="applyValueSelection()" 
            *ngIf="this.field.controlType === 'multiselect'"
            [disabled]="isLoading">
            Apply
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div
  *ngIf="showPopup"
  class="custom-popup"
  [ngStyle]="popupStyle"
  [style.--popup-arrow-color]="popupArrowColor">
  <ul>
    <li *ngFor="let item of popupData">{{ item }}</li>
  </ul>
</div>
